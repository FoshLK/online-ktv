[package]
name = "ktv-client"
version = "0.2.0"
description = "线上 KTV 用户桌面端"
authors = ["online-ktv contributors"]
edition = "2021"

[lib]
name = "ktv_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
